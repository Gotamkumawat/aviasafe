    <script>
      // Safari/Chrome can restore an empty React root from its back-forward cache.
      // Reload once in that case so browser Back/Forward always shows the page.
      (function () {
        function repairBlankRestore() {
          const root = document.getElementById('root');
          const logoHomeNavigation = sessionStorage.getItem('aviasafe-logo-home-navigation') === '1';
          // A React shell can have a non-empty #root while its route content is
          // missing. Treat that state as blank after a logo-to-Home navigation.
          const homeRendered = root && root.querySelector('main')?.childElementCount > 0;
          if (root && (root.childElementCount && (!logoHomeNavigation || homeRendered))) {
            if (logoHomeNavigation && homeRendered) sessionStorage.removeItem('aviasafe-logo-home-navigation');
            return;
          }
          const key = 'aviasafe-back-recovery:' + location.pathname;
          if (sessionStorage.getItem(key)) return;
          sessionStorage.setItem(key, '1');
          sessionStorage.removeItem('aviasafe-logo-home-navigation');
          location.reload();
        }
        window.addEventListener('pageshow', function (event) {
          if (event.persisted) location.reload();
        });
        // React's restored history entry can be blank even when #root still has
        // hidden nodes. A normal reload is reliable for every browser Back/Forward.
        window.addEventListener('popstate', function () {
          location.reload();
        });
        window.addEventListener('load', function () {
          setTimeout(repairBlankRestore, 2500);
        });
      })();
    </script>
    <script>
      (function() {
        let ready = false;
        let splashSeen = false;
        const body = document.body;
        let noSplashTimer = null;

        function setAppReady() {
          if (ready) return;
          ready = true;
          body.classList.add('app-ready');
        }

        function getSplash() {
          return document.querySelector('.splash');
        }

        function onSplashVisible() {
          splashSeen = true;
          if (noSplashTimer) {
            clearTimeout(noSplashTimer);
            noSplashTimer = null;
          }
        }

        function onSplashHidden() {
          if (splashSeen) {
            setAppReady();
          }
        }

        function startNoSplashTimer() {
          if (noSplashTimer) return;
          noSplashTimer = setTimeout(() => {
            if (!getSplash()) {
              setAppReady();
            }
          }, 1800);
        }

        const observer = new MutationObserver(() => {
          const splash = getSplash();
          if (splash) {
            onSplashVisible();
            if (splash.classList.contains('out')) {
              onSplashHidden();
            }
          } else if (splashSeen) {
            onSplashHidden();
          }
        });

        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ['class']
        });

        window.addEventListener('load', () => {
          const splash = getSplash();
          if (splash) {
            onSplashVisible();
            if (splash.classList.contains('out')) {
              onSplashHidden();
            }
          } else {
            startNoSplashTimer();
          }
        }, { once: true });
      })();
    </script>

<script>
(function(){function addLink(nav,id,label,onClick){if(!nav||nav.querySelector('#'+id))return false;var link=document.createElement('a');link.id=id;link.href='#';link.textContent=label;link.style.cssText='font-weight:600;font-size:14.5px;color:#1a202c;white-space:nowrap;padding:10px 14px;border-radius:8px;cursor:pointer;text-decoration:none;transition:color .2s;';link.onmouseenter=function(){link.style.color='#8FD2F4';};link.onmouseleave=function(){link.style.color='#1a202c';};link.onclick=function(e){e.preventDefault();onClick();};var anchor=nav.querySelector('.navbar-cta,.navbar-search,.navbar-theme,.navbar-burger');nav.insertBefore(link,anchor||null);return true}function wire(){var cap=document.getElementById('cap-search-overlay');var sms=document.getElementById('sms-overlay');var nav=document.querySelector('.navbar-links');if(!cap||!sms||!nav)return false;addLink(nav,'cap-link','Capability Search',function(){window.location.href='/capability-search';});if(window.location.pathname==='/capability-search'){var cl=nav.querySelector('#cap-link');if(cl)cl.classList.add('active');}
addLink(nav,'sms-link','SMS',function(){window.location.href='/sms';});if(window.location.pathname==='/sms'){var sl=nav.querySelector('#sms-link');if(sl)sl.classList.add('active');};cap.onclick=function(e){if(e.target===cap)cap.style.display='none'};sms.onclick=function(e){if(e.target===sms)sms.style.display='none'};return true}function init(){if(wire())return;var tries=0;var timer=setInterval(function(){tries+=1;if(wire()||tries>40)clearInterval(timer)},100);var observer=new MutationObserver(function(){wire()});observer.observe(document.documentElement,{childList:true,subtree:true});window.addEventListener('load',wire,{once:true})}init();})();
</script>

<script>
(() => {
  if (!new URLSearchParams(location.search).has('capability-search')) return;
  const openCapabilitySearch = () => {
    const overlay = document.getElementById('cap-search-overlay');
    if (!overlay) return false;
    overlay.style.display = 'flex';
    history.replaceState(null, '', location.pathname);
    return true;
  };
  if (openCapabilitySearch()) return;
  const timer = setInterval(() => { if (openCapabilitySearch()) clearInterval(timer); }, 50);
  setTimeout(() => clearInterval(timer), 5000);
})();
</script>

<script>
(() => {

  const setSmsHeader = () => {
    const header = document.querySelector('.navbar');
    const nav = header?.querySelector('.navbar-links');
    if (!header || !nav || header.dataset.smsHeaderReady) return;
    header.dataset.smsHeaderReady = 'true';
    nav.innerHTML = '';
    [
      ['Home', '/'],
      ['Approvals', '/approvals'],
      ['About Us', '/about'],
      ['Contact Us', '/contact']
    ].forEach(([label, href]) => {
      const link = document.createElement('a');
      link.href = href;
      link.textContent = label;
      if (href === '/') link.className = 'active';
      nav.appendChild(link);
    });
    const capability = document.createElement('a');
    capability.href = '/capability-search';
    capability.textContent = 'Capability Search';
    nav.appendChild(capability);
    const sms = document.createElement('a');
    sms.href = '/sms';
    sms.textContent = 'SMS';
    nav.appendChild(sms);
  };
  const mount = () => {
    const root = document.getElementById('root');
    if (!root || root.dataset.smsMounted) return;
    const header = root.querySelector('.navbar');
    if (!header) return;
    root.dataset.smsMounted = 'true';
    // Hide React content but don't remove (keeps React interactive)
    root.querySelectorAll('main, footer, .hero-d, .services-lite, .customers-lite, .stats-lite-wrap, .why-choose, .home-achieve, .home-address, .approved-lite').forEach(el => el.style.display = 'none');
    // Also hide sections that show after navbar
    const allSections = root.querySelectorAll('section, .section');
    allSections.forEach(el => { if(!el.closest('.navbar') && !el.closest('header')) el.style.display = 'none'; });
    header.insertAdjacentElement('afterend', page);
    const form = page.querySelector('#sms-form'), status = page.querySelector('.sms-status');
    form.addEventListener('submit', async event => {
      event.preventDefault(); const button=form.querySelector('button'), data=Object.fromEntries(new FormData(form)); button.disabled=true; button.textContent='Submitting…';
      try { const response=await fetch('/api/v1/submissions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({formType:'query',name:data.name,phone:data.phone,service:data.service,message:data.message,sourcePath:'/sms'})}); if(!response.ok) throw new Error(); form.reset(); status.textContent='Thank you — your SMS support request has been received.'; status.className='sms-status success'; }
      catch { status.textContent='Unable to submit right now. Please try again.'; status.className='sms-status error'; }
      finally { button.disabled=false; button.textContent='Submit SMS Request →'; }
    });
  };
  const timer=setInterval(() => { mount(); if(document.getElementById('root')?.dataset.smsMounted) clearInterval(timer); }, 50);
})();
</script>

<script>
// Fix active nav highlight when navigating via search popup
(function(){
  function fixNav(){
    var nav=document.querySelector('.navbar-links');
    if(!nav) return;
    var path=window.location.pathname;
    var links=nav.querySelectorAll('a');
    links.forEach(function(link){
      link.classList.remove('active');
      var href=link.getAttribute('href');
      var id=link.id;
      if(id==='cap-link' && path==='/capability-search') link.classList.add('active');
      else if(id==='sms-link' && path==='/sms') link.classList.add('active');
      else if(path==='/' && href==='/') link.classList.add('active');
      else if(href && href!=='/' && href!=='#' && path.startsWith(href)) link.classList.add('active');
    });
  }

  // Force full reload when navigating away from /capability-search or /sms
  // AND when navigating TO /capability-search or /sms from other pages
  function interceptNavLinks(){
    document.addEventListener('click', function(e){
      var link=e.target.closest('a');
      if(!link) return;
      var href=link.getAttribute('href');
      if(!href || href==='#') return;
      var path=window.location.pathname;
      
      // If ON capability-search or sms — force reload for ANY internal link
      if(path==='/capability-search' || path==='/sms'){
        if(href.startsWith('/')){
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          window.location.href=href;
          return;
        }
      }
      
      // If clicking capability-search or sms link from ANY page — force reload
      if(href==='/capability-search' || href==='/sms'){
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        window.location.href=href;
      }
      
      // Force ALL internal nav links to do full page reload
      if(href.startsWith('/') && link.closest('.navbar-links,.navbar-logo,.navbar,header')){
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        window.location.href=href;
      }
    }, true);
  }
  interceptNavLinks();
  }
  var lastPath=window.location.pathname;
  setInterval(function(){
    if(window.location.pathname!==lastPath){
      lastPath=window.location.pathname;
      setTimeout(fixNav,100);
    }
  },200);
  // Run on initial load too — multiple times to catch injected links
  setTimeout(fixNav,2000);
  setTimeout(fixNav,3000);
  setTimeout(fixNav,4000);
})();
</script>
